<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>StreamCrew — Sala</title>
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="theme-color" content="#0b0d12" />
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
  <script>(function(){try{var t=localStorage.getItem("sc:theme");if(t!=="light"&&t!=="dark"){t=window.matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";}document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="page-room">
  <header class="topbar room-topbar">
    <a class="logo" href="/">
      <svg viewBox="0 0 32 32" width="24" height="24" aria-hidden="true">
        <rect x="2" y="6" width="20" height="14" rx="3" fill="url(#g1)"/>
        <path d="M20 10.5 L28 6.5 L28 19.5 L20 15.5 Z" fill="url(#g1)"/>
        <circle cx="9" cy="26" r="2.4" fill="#8b5cf6"/>
        <circle cx="15" cy="26" r="2.4" fill="#22d3ee"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#8b5cf6"/>
            <stop offset="1" stop-color="#22d3ee"/>
          </linearGradient>
        </defs>
      </svg>
    </a>
    <div class="room-info">
      <span class="room-name" id="room-name"></span>
      <span class="room-count" id="room-count"></span>
      <span class="priv-badge hidden" id="priv-badge" title="Sala privada">🔒</span>
    </div>
    <div class="room-actions">
      <button id="stats-btn" class="btn btn-ghost btn-sm" type="button" title="Qualidade da conexão">📡 Qualidade</button>
      <button id="theme-btn" class="icon-btn" type="button" title="Alternar tema" aria-label="Alternar tema">☀️</button>
      <button id="copy-link-btn" class="btn btn-ghost btn-sm" type="button">Copiar link</button>
      <button id="leave-btn" class="btn btn-danger btn-sm" type="button">Sair</button>
    </div>
  </header>

  <div class="room-layout">
    <main class="stage-wrap">
      <div id="tiles" class="tiles">
        <div id="empty-state" class="empty-state">
          <span class="empty-ico">📡</span>
          <h2>Ninguém está transmitindo ainda</h2>
          <p>Clique em <strong>Transmitir tela</strong> ou aperte <strong>S</strong>.</p>
          <p class="shortcut-hint">Atalhos: S tela · C câmera · M microfone · Esc desfoca</p>
        </div>
      </div>
      <div id="banner" class="banner hidden">Reconectando…</div>
    </main>

    <aside class="sidebar">
      <div class="sidebar-tabs">
        <button id="tab-people" class="sidebar-tab active" type="button">Pessoas</button>
        <button id="tab-chat" class="sidebar-tab" type="button">Chat</button>
      </div>
      <div id="people-panel" class="sidebar-panel">
        <ul id="people-list" class="people-list"></ul>
      </div>
      <div id="chat-panel" class="sidebar-panel hidden">
        <div id="chat-messages" class="chat-messages"></div>
        <form id="chat-form" class="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Manda uma…" maxlength="500" />
          <button type="submit" class="btn btn-primary btn-sm">Enviar</button>
        </form>
      </div>
    </aside>
  </div>

  <footer class="controls">
    <div class="preset-group">
      <label class="sr-only" for="modo-select">Modo</label>
      <select id="modo-select" class="ctrl-select" title="Modo de transmissão">
        <option value="tela" selected>🖥️ Tela</option>
        <option value="jogo">🎮 Jogo</option>
      </select>
      <label class="sr-only" for="quality-select">Qualidade</label>
      <select id="quality-select" class="ctrl-select" title="Qualidade (aplicada ao iniciar)">
        <option value="auto" selected>✨ Auto</option>
        <option value="360">360p</option>
        <option value="480">480p</option>
        <option value="720">720p</option>
        <option value="1080">1080p</option>
        <option value="1440">1440p</option>
        <option value="2160">2160p</option>
      </select>
      <label class="sr-only" for="fps-select">FPS</label>
      <select id="fps-select" class="ctrl-select" title="Quadros por segundo (aplicado ao iniciar)">
        <option value="auto" selected>✨ FPS: Auto</option>
        <option value="30">30 FPS</option>
        <option value="60">60 FPS</option>
      </select>
    </div>
    <button id="screen-btn" class="ctrl" type="button" title="Compartilhar tela">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M3 4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-4v2h3v2H6v-2h3v-2H5a2 2 0 0 1-2-2V4Zm2 0v10h14V4H5Z"/></svg>
      <span>Transmitir tela</span>
    </button>
    <button id="cam-btn" class="ctrl" type="button" title="Ligar câmera">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M4 5h10a2 2 0 0 1 2 2v2.3l4-2.3v10l-4-2.3V17a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V7a2 2 0 0 1 2-2Z"/></svg>
      <span>Câmera</span>
    </button>
    <button id="mic-btn" class="ctrl" type="button" title="Ligar microfone">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M12 2a3 3 0 0 1 3 3v6a3 3 0 0 1-6 0V5a3 3 0 0 1 3-3Zm-7 9h2a5 5 0 0 0 10 0h2a7 7 0 0 1-6 6.93V21h-2v-3.07A7 7 0 0 1 5 11Z"/></svg>
      <span>Microfone</span>
    </button>
  </footer>

  <div id="join-overlay" class="overlay">
    <div class="overlay-card">
      <h2>Entrar na sala</h2>
      <p class="overlay-sub">Como você quer aparecer pro pessoal?</p>
      <p id="join-error" class="join-error hidden"></p>
      <form id="join-room-form" autocomplete="off">
        <label for="name-input" class="sr-only">Seu nome</label>
        <input id="name-input" type="text" placeholder="Seu nome" maxlength="24" required />
        <div id="code-wrap" class="hidden">
          <label for="code-input" class="sr-only">Código da sala</label>
          <input id="code-input" type="text" inputmode="numeric" placeholder="Código da sala (6 dígitos)" maxlength="6" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Entrar →</button>
      </form>
    </div>
  </div>

  <div id="toasts" class="toasts" aria-live="polite"></div>

  <script src="/js/theme.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
